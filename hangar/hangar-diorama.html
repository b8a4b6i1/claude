<title>Hangar — a small diorama</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #9be0f2;
  }
  body { -webkit-tap-highlight-color: transparent; }
  #frame {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 100vw;
    height: 100vh;
    transform: translate(-50%, -50%);
    background: #9be0f2;
  }
  @media (max-width: 620px) {
    #frame { width: 100vw; height: 100vh; }
  }
  #stage {
    display: block;
    width: 100%;
    height: 100%;
    background: #9be0f2;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    outline: none;
  }
  #snd { position: fixed; right: 14px; bottom: 14px; width: 40px; height: 40px; border: 2px solid #1a1816; background: #fff; border-radius: 4px; padding: 6px; cursor: pointer; opacity: 0.55; }
  #snd:hover, #snd:focus-visible { opacity: 1; outline: none; }
  #snd svg { width: 100%; height: 100%; display: block; }
  #fallback {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #ffffff;
    color: #333a3d;
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.02em;
    text-align: center;
    padding: 2rem;
  }
  #fallback[hidden] { display: none; }
</style>

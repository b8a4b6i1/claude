<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Jornada Gerencia de Personas · Video introductorio (versión color)</title>
<style>
/* Títulos: Goli (oficial, OFL). Texto: Trebuchet MS (oficial). */
@font-face{font-family:'Head';src:url(fonts/goli-light.otf) format('opentype');font-weight:300;font-display:block}
@font-face{font-family:'Head';src:url(fonts/goli-regular.otf) format('opentype');font-weight:400;font-display:block}
@font-face{font-family:'Head';src:url(fonts/goli-medium.otf) format('opentype');font-weight:500;font-display:block}
@font-face{font-family:'Head';src:url(fonts/goli-semibold.otf) format('opentype');font-weight:600;font-display:block}
@font-face{font-family:'Head';src:url(fonts/goli-bold.otf) format('opentype');font-weight:700;font-display:block}
@font-face{font-family:'Body';src:url(fonts/trebuc.ttf) format('truetype');font-weight:400;font-display:block}
@font-face{font-family:'Body';src:url(fonts/trebucbd.ttf) format('truetype');font-weight:700 900;font-display:block}
:root{--ink:#162851;--slate:#4b5571;--brand:#0055b8;--mid:#2a6fc4;--light:#7aa9e3;--soft:#b3cbea;--pale:#dde6f3}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#fff;font-family:'Head',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
canvas.layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
.scene{position:absolute;inset:0;visibility:hidden}
.abs{position:absolute}
.ctr{text-align:center}
.w{display:inline-block;will-change:transform}
.mask{display:inline-block;overflow:hidden;padding:0.1em 0.06em 0.18em;margin:-0.1em -0.06em -0.18em;vertical-align:top}
.g{background:linear-gradient(95deg,#162851 0%,#0055b8 55%,#2a6fc4 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ph{background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;color:transparent}
.title{font-size:120px;font-weight:700;letter-spacing:-0.045em;line-height:1.02;color:var(--ink);white-space:nowrap}
.sub{font-family:'Body',sans-serif;font-size:58px;line-height:1.32;color:var(--slate);white-space:nowrap}
.eyebrow{font-size:58px;font-weight:700;letter-spacing:-0.01em;color:var(--brand);white-space:nowrap}
#dot{display:inline-block;width:0.19em;height:0.19em;border-radius:50%;background:var(--brand);margin-left:0.035em;vertical-align:baseline}
#glass{position:absolute;visibility:hidden;border-radius:48px;
  -webkit-backdrop-filter:blur(30px) saturate(1.7);backdrop-filter:blur(30px) saturate(1.7);
  box-shadow:0 60px 110px -50px rgba(22,40,81,0.30),0 2px 8px rgba(22,40,81,0.05),inset 0 1.5px 0 rgba(255,255,255,0.95),inset 0 0 0 1.5px rgba(255,255,255,0.55)}
/* viñeta de marca (pestaña con punta, lineamientos 2025) */
#tab{position:absolute;left:160px;top:372px;width:190px;height:236px;background:var(--brand);clip-path:polygon(0 0,70% 0,100% 50%,70% 100%,0 100%);overflow:hidden}
#tabr{position:absolute;left:0;top:0;width:133px}
#tabr div{height:236px;line-height:236px;text-align:center;font-size:150px;font-weight:700;color:#fff;letter-spacing:-0.04em}
.agr{position:absolute;left:430px;top:372px;width:1420px;font-size:108px;font-weight:700;letter-spacing:-0.045em;line-height:1.04;color:var(--ink);white-space:nowrap}
</style>
</head>
<body>
<div id="stage">
  <canvas class="layer" id="bg" width="1920" height="1080"></canvas>
  <div id="glass"></div>

  <!-- 0 · Bienvenida -->
  <div class="scene" id="s0">
    <div class="abs ctr" id="s0a" style="left:0;width:1920px;top:524px;font-size:66px;font-weight:500;letter-spacing:-0.01em;color:var(--slate);white-space:nowrap"></div>
    <div class="abs ctr title" id="s0b" style="left:0;width:1920px;top:628px;font-size:112px"></div>
  </div>

  <!-- 1 · Hoy nos detenemos -->
  <div class="scene" id="s1">
    <div class="abs ctr" id="s1g" style="left:0;width:1920px;top:318px">
      <div id="s1a" style="font-size:164px;font-weight:700;letter-spacing:-0.05em;line-height:1.02;white-space:nowrap"></div>
      <div id="s1b" style="margin-top:44px;font-size:78px;font-weight:700;letter-spacing:-0.035em;line-height:1.1;white-space:nowrap"></div>
    </div>
  </div>

  <!-- 2 · Escuchamos -->
  <div class="scene" id="s2">
    <div class="abs title" id="s2t" style="left:160px;top:340px;font-size:104px"></div>
    <div class="abs sub" id="s2s" style="left:164px;top:628px"></div>
  </div>

  <!-- 3 · Conversamos -->
  <div class="scene" id="s3">
    <div class="abs ctr title" id="s3t" style="left:0;width:1920px;top:118px"></div>
    <div class="abs ctr sub" id="s3s" style="left:0;width:1920px;top:282px"></div>
  </div>

  <!-- 4 · Priorizamos -->
  <div class="scene" id="s4">
    <div class="abs ctr title" id="s4t" style="left:0;width:1920px;top:118px"></div>
    <div class="abs ctr sub" id="s4s" style="left:0;width:1920px;top:282px"></div>
  </div>

  <!-- 5 · Fundamentamos -->
  <div class="scene" id="s5">
    <div class="abs title" id="s5t" style="left:160px;top:358px;font-size:76px"></div>
    <div class="abs sub" id="s5s" style="left:164px;top:600px"></div>
  </div>

  <!-- 6 · Para salir con -->
  <div class="scene" id="s6">
    <div class="abs ctr eyebrow" id="s6e" style="left:0;width:1920px;top:312px"></div>
    <div class="abs ctr title" id="lab0" style="left:60px;width:1800px;top:420px;font-size:104px"></div>
    <div class="abs ctr title" id="lab1" style="left:60px;width:1800px;top:420px;font-size:104px"></div>
    <div class="abs ctr title" id="lab2" style="left:60px;width:1800px;top:420px;font-size:104px"></div>
  </div>

  <!-- 7 · Acuerdos -->
  <div class="scene" id="s7">
    <div class="abs eyebrow" id="s7e" style="left:160px;top:240px"></div>
    <div id="tab"><div id="tabr"><div>1</div><div>2</div><div>3</div><div>4</div></div></div>
    <div class="agr" id="a0"></div>
    <div class="agr" id="a1"></div>
    <div class="agr" id="a2"></div>
    <div class="agr" id="a3"></div>
  </div>

  <!-- 8 · Al final del día -->
  <div class="scene" id="s8">
    <div class="abs ctr sub" id="s8a" style="left:0;width:1920px;top:276px;font-size:68px"></div>
    <div class="abs ctr title" id="s8b" style="left:0;width:1920px;top:400px;font-size:112px"></div>
  </div>

  <!-- 10 · R35 necesita a personas -->
  <div class="scene" id="s10">
    <div class="abs ctr" id="s10b" style="left:0;width:1920px;top:718px;font-size:84px;font-weight:700;letter-spacing:-0.035em;line-height:1.1;white-space:nowrap"></div>
  </div>

  <canvas class="layer" id="fg" width="1920" height="1080"></canvas>
</div>

<script src="assets/logo-paths.js"></script>
<script>
'use strict';
const W=1920,H=1080,OFF=2*63.1/26,DUR=79.0+OFF;   // OFF: la bienvenida desplaza todo lo posterior dos compases de música
window.DUR=DUR;
/* ───────── utilidades ───────── */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const E={
  lin:t=>t,
  outCubic:t=>1-Math.pow(1-t,3),
  inCubic:t=>t*t*t,
  inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outQuint:t=>1-Math.pow(1-t,5),
  inQuint:t=>t*t*t*t*t,
  outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),
  inExpo:t=>t<=0?0:Math.pow(2,10*t-10),
  inOutQuint:t=>t<.5?16*t*t*t*t*t:1-Math.pow(-2*t+2,5)/2,
  outBack:t=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  inOutSine:t=>-(Math.cos(Math.PI*t)-1)/2,
};
const P=(t,a,b,e=E.outExpo)=>e(clamp((t-a)/(b-a)));
const $=id=>document.getElementById(id);
function S(el,o={}){
  const {op=1,x=0,y=0,s=1,b=0}=o;
  el.style.opacity=op<0.001?0:op;
  el.style.transform=`translate(${x}px,${y}px) scale(${s})`;
  el.style.filter=b>0.05?`blur(${b}px)`:'none';
}
function vis(el,on){el.style.visibility=on?'visible':'hidden'}
// salida de bloque: sube con desenfoque
function out(t,c,d=0.45,dist=36,blur=12){const o=P(t,c,c+d,E.inCubic);return{op:1-o,y:-o*dist,b:o*blur}}
// texto con marcado mínimo: _color de marca_, ~degradado~; « / » = salto de línea
// ^palabra^ = relleno con fotografía de marca: ph={img,size,pos}
function words(el,src,ph){
  el.innerHTML='';const res=[];
  src.split(' ').forEach((tok,i,arr)=>{
    if(tok==='/'){el.appendChild(document.createElement('br'));return;}
    let cls='',txt=tok;
    const m=tok.match(/^([_~^])(.*?)([_~^])?$/);
    if(m){txt=m[2];cls=m[1]}
    const mk=document.createElement('span');mk.className='mask';
    const s=document.createElement('span');s.className='w'+(cls==='~'?' g':'');s.textContent=txt;
    if(cls==='_')s.style.color='var(--brand)';
    if(cls==='^'&&ph){s.classList.add('ph');s.style.backgroundImage=`url(assets/photos/${ph.img}.jpg)`;s.style.backgroundSize=ph.size||'cover';s.style.backgroundPosition=ph.pos||'50% 50%';}
    mk.appendChild(s);el.appendChild(mk);
    if(i<arr.length-1&&arr[i+1]!=='/')el.appendChild(document.createTextNode(' '));
    res.push(s);
  });
  return res;
}
// revelado palabra a palabra desde una máscara
function reveal(ws,t,a,stag=0.07,d=0.85,dist=1.1){
  ws.forEach((w,i)=>{const p=P(t,a+i*stag,a+i*stag+d,E.outExpo);
    const fs=parseFloat(getComputedStyle(w).fontSize);
    S(w,{y:(1-p)*fs*dist,op:Math.min(1,p*2.5)});});
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hexRGB=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixRGB=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];
const rgba=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const C={ink:hexRGB('#162851'),deep:hexRGB('#162851'),brand:hexRGB('#0055b8'),mid:hexRGB('#2a6fc4'),sky:hexRGB('#4d8bd6'),light:hexRGB('#7aa9e3'),soft:hexRGB('#b3cbea'),pale:hexRGB('#dde6f3'),gray:hexRGB('#c6cad3'),vo:hexRGB('#225f58'),vc:hexRGB('#819e49'),mo:hexRGB('#410c5c'),am:hexRGB('#f9ab3a'),white:[255,255,255]};

// radios negativos por sobrepaso de easing → 0
for(const P2 of [CanvasRenderingContext2D.prototype,OffscreenCanvasRenderingContext2D.prototype]){
  const arc=P2.arc,ell=P2.ellipse;
  P2.arc=function(x,y,r,...a){return arc.call(this,x,y,Math.max(0,r),...a)};
  P2.ellipse=function(x,y,rx,ry,...a){return ell.call(this,x,y,Math.max(0,rx),Math.max(0,ry),...a)};
}
const bg=$('bg').getContext('2d'), fg=$('fg').getContext('2d');
/* ───────── fotografías de la identidad visual (cargan antes de READY) ───────── */
const PH={};
const phLoad=Promise.all(['granulos','burbujas','aceite-calido','aceite-color','burbujas-verde'].map(n=>new Promise(res=>{const im=new Image();im.onload=()=>{PH[n]=im;res()};im.onerror=()=>res();im.src=`assets/photos/${n}.jpg`;})));
// foto recortada tipo «cover» dentro de un rectángulo redondeado, con deriva lenta (zoom)
function photoCard(g,img,x,y,w,h,r,op,zoom=1,fx=0.5,fy=0.5){
  if(!img||op<=0.002)return;
  const k=Math.max(w/img.width,h/img.height)*zoom, sw=w/k, sh=h/k;
  const sx=clamp(fx*img.width-sw/2,0,img.width-sw), sy=clamp(fy*img.height-sh/2,0,img.height-sh);
  g.save();g.globalAlpha=op;g.beginPath();rrect(g,x,y,w,h,r);g.clip();g.drawImage(img,sx,sy,sw,sh,x,y,w,h);g.restore();
}
// pastilla/círculo relleno con una zona de la foto (u,v ∈ 0..1) y un brillo físico suave
function photoPill(g,cx,cy,w,h,r,img,u,v,span,a){
  if(!img||a<=0.002)return;
  const sw=img.width*span, sh=sw*h/w, sx=clamp(u*img.width-sw/2,0,img.width-sw), sy=clamp(v*img.height-sh/2,0,img.height-sh);
  g.save();g.globalAlpha=a;g.beginPath();rrect(g,cx-w/2,cy-h/2,w,h,r);g.clip();
  g.drawImage(img,sx,sy,sw,sh,cx-w/2,cy-h/2,w,h);
  const gr=g.createRadialGradient(cx-w*0.22,cy-h*0.28,0,cx-w*0.22,cy-h*0.28,Math.max(w,h)*0.7);
  gr.addColorStop(0,'rgba(255,255,255,0.38)');gr.addColorStop(0.45,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(cx-w/2,cy-h/2,w,h);
  g.restore();
}
function rrect(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function pill(g,cx,cy,w,h,r,col,a=1){g.fillStyle=rgba(col,a);g.beginPath();rrect(g,cx-w/2,cy-h/2,w,h,r);g.fill();}
function disc(g,x,y,r,col,a=1){g.fillStyle=rgba(col,a);g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();}
function ring(g,x,y,r,col,a,lw=2){if(a<=0.002)return;g.strokeStyle=rgba(col,a);g.lineWidth=lw;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.stroke();}

/* ───────── logo oficial (vectores del archivo de marca) ───────── */
const LG=window.LOGO;
const LP={};for(const k in LG.parts)LP[k]=new Path2D(LG.parts[k].d);
const LETTERS=['X','I','Q','U','I2','M'];
const LB={x0:LG.parts.mark.bbox[0],x1:LG.parts.M.bbox[2],y0:LG.parts.mark.bbox[1],y1:LG.parts.mark.bbox[3]};
const lockAt=k=>({x:W/2-(LB.x0+LB.x1)/2*k,y:H/2-(LB.y0+LB.y1)/2*k});
const LK0=700/(LB.x1-LB.x0), LK1=760/(LB.x1-LB.x0);
const MB=LG.parts.mark.bbox, MC=[(MB[0]+MB[2])/2,(MB[1]+MB[3])/2];
// centro del hexágono interior del isotipo
const INNER=(()=>{const c=new OffscreenCanvas(LG.w*4,LG.h*4),g=c.getContext('2d');g.scale(4,4);g.fill(LP.mark);
  const d=g.getImageData(0,0,c.width,c.height).data;
  let sx=0,sy=0,n=0;const cy=Math.round(MC[1]*4);
  for(let y=cy-30;y<cy+30;y++)for(let x=Math.round(MC[0]*4-90);x<MC[0]*4+90;x++){if(d[(y*c.width+x)*4+3]>128){sx+=x;sy+=y;n++}}
  return [sx/n/4,sy/n/4];})();
const logoBuf=new OffscreenCanvas(W,H), lb=logoBuf.getContext('2d');
function drawLogo(g,ox,oy,k,o){
  lb.setTransform(1,0,0,1,0,0);lb.clearRect(0,0,W,H);
  lb.setTransform(k,0,0,k,ox,oy);
  const col=LG.color;
  if(o.markFill>0){
    lb.save();
    if(o.clipR!=null){lb.beginPath();lb.arc(INNER[0],INNER[1],o.clipR,0,Math.PI*2);lb.clip();}
    lb.globalAlpha=o.markFill;lb.fillStyle=col;lb.fill(LP.mark);lb.restore();
  }
  if(o.letters){
    LETTERS.forEach((L,i)=>{const s=o.letters[i];if(!s||s.op<=0)return;
      const bb=LG.parts[L].bbox;
      lb.save();lb.beginPath();lb.rect(bb[0]-4,bb[1]-2,bb[2]-bb[0]+8,bb[3]-bb[1]+6);lb.clip();
      lb.translate(0,s.dy);lb.globalAlpha=s.op;lb.fillStyle=col;lb.fill(LP[L]);lb.restore();});
  }
  if(o.sheen!=null&&o.sheen>0&&o.sheen<1){
    lb.save();lb.globalCompositeOperation='source-atop';
    const x=lerp(LB.x0-80,LB.x1+80,o.sheen);
    const gr=lb.createLinearGradient(x-40,0,x+40,0);
    gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(200,228,255,0.8)');gr.addColorStop(1,'rgba(255,255,255,0)');
    lb.setTransform(k,0,0,k,ox,oy);lb.transform(1,0,-0.5,1,0,0);
    lb.fillStyle=gr;lb.fillRect(LB.x0-200,LB.y0-20,LB.x1-LB.x0+400,LB.y1-LB.y0+40);lb.restore();
  }
  lb.setTransform(1,0,0,1,0,0);
  g.drawImage(logoBuf,0,0);
}

/* ───────── fondo: blanco; color tenue solo detrás del vidrio ───────── */
const CARD={x:960,y:130,w:900,h:820,r:56};
function ambient(t,amt){
  bg.fillStyle='#fff';bg.fillRect(0,0,W,H);
  // escena 2: burbujas; escena 5: gránulos — la foto aparece desde su centro y deriva lentamente
  const a2=P(t,9.9,10.9,E.outExpo)*(1-P(t,15.0,15.6,E.inCubic)), a5=P(t,28.85,29.9,E.outExpo)*(1-P(t,34.8,35.4,E.inCubic));
  [[a2,'burbujas',9.9,0.62,0.45],[a5,'granulos',28.85,0.5,0.42]].forEach(([a,n,t0,fx,fy])=>{if(a<=0.002)return;
    const sc=lerp(0.94,1,a), w=CARD.w*sc, h=CARD.h*sc;
    photoCard(bg,PH[n],CARD.x+(CARD.w-w)/2,CARD.y+(CARD.h-h)/2,w,h,CARD.r,a,lerp(1.1,1.0,clamp((t-t0)/6)),fx,fy);});
  return;
  const blobs=[[1220,360,320,C.light,0.42,0.21],[1600,740,340,C.brand,0.2,0.17],[1240,760,260,C.sky,0.22,0.25]];
  blobs.forEach(([x,y,r,c,a,f],i)=>{
    const cx=x+Math.sin(t*f+i*2)*60, cy=y+Math.cos(t*f*1.3+i)*50;
    const gr=bg.createRadialGradient(cx,cy,0,cx,cy,r);
    gr.addColorStop(0,rgba(c,a*amt));gr.addColorStop(1,rgba(c,0));
    bg.fillStyle=gr;bg.fillRect(0,0,W,H);
  });
}

/* ───────── vidrio (DOM con backdrop-filter) ───────── */
const GL=$('glass');
const PAN={x:1000,y:200,w:760,h:680,r:48};
function glassSet(x,y,w,h,r,col,a,op,dy=0,sc=1){
  vis(GL,op>0.002);
  Object.assign(GL.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',borderRadius:r+'px',background:rgba(col,a),opacity:op,transform:`translateY(${dy}px) scale(${sc})`});
}
function glass(t){
  if(t>10.1&&t<15.7){ // escena 2: gráfico del diagnóstico
    const i=P(t,10.2,11.1,E.outExpo), o=P(t,15.0,15.6,E.inCubic);
    glassSet(PAN.x,PAN.y,PAN.w,PAN.h,PAN.r,C.white,0.62,i*(1-o),(1-i)*30,lerp(0.98,1,i));
  } else if(t>=28.75&&t<35.4){ // escena 5: la prioridad se expande en panel
    const k=P(t,28.8,30.0,E.inOutQuint), c=P(t,29.0,30.0,E.inOutCubic), o=P(t,34.8,35.3,E.inCubic);
    const R0=ROWBAR;
    glassSet(lerp(R0.x,PAN.x,k),lerp(R0.y,PAN.y,k),lerp(R0.w,PAN.w,k),lerp(R0.h,PAN.h,k),lerp(R0.h/2,PAN.r,k),mixRGB(C.brand,C.white,c),lerp(1,0.62,c),1-o);
  } else vis(GL,false);
}

/* ───────── 0–1 · logo → su núcleo se vuelve el punto de «Hoy nos detenemos.» ───────── */
let DOT_REST={x:0,y:0,r:17}, DOT_END={x:0,y:0,r:17};
function intro(t){
  const u=t-OFF;               // reloj del resto del video
  if(u>4.95)return;
  const L=lockAt(LK0);
  // el logo sube y se achica para dar paso a la bienvenida
  const up=P(t,3.15,4.15,E.inOutQuint);

  let st=20,tx=[];
  for(;st<70;st+=0.5){tx=sampleText(g=>vamosText(g,1,1,0),220,820,st);if(tx.length<=r35.length)break;}
  const byX=(a,b)=>a[0]-b[0]||a[1]-b[1];
  r35.sort(byX);tx.sort(byX);
  // destinos en el isotipo del logo final
  const L=lockAt(LK1);
  const mk=(()=>{const c=new OffscreenCanvas(W,H),g=c.getContext('2d');g.setTransform(LK1,0,0,LK1,L.x,L.y);g.fill(LP.mark);
    const d=g.getImageData(0,0,W,H).data,pts=[];for(let y=0;y<H;y+=6)for(let x=0;x<W;x+=6){if(d[(y*W+x)*4+3]>200)pts.push([x,y])}return pts})();
  const r=rng(35);
  for(let i=mk.length-1;i>0;i--){const j=(r()*(i+1))|0;[mk[i],mk[j]]=[mk[j],mk[i]]}
  PEOPLE=r35.map((p,i)=>{const s=tx[Math.min(tx.length-1,Math.floor(i*tx.length/r35.length))];
    return{x:p[0],y:p[1],sx:s[0],sy:s[1],d:(p[0]-560)/800*0.45+r()*0.3,c:[C.deep,C.brand,C.brand,C.mid,C.sky,C.light][(r()*6)|0],ph:r()*6.28,m:mk[i%mk.length],dm:r()*0.35};});
  window.NPEOPLE=PEOPLE.length;window.TEXTSTEP=st;
}
function person(g,x,y,s,col,a,morph){
  g.fillStyle=rgba(col,a);
  if(morph>=1){g.beginPath();g.arc(x,y,3.4,0,Math.PI*2);g.fill();return}
  const k=lerp(s,7,morph);
  g.beginPath();g.arc(x,y-k*0.34,k*0.24,0,Math.PI*2);g.fill();
  g.beginPath();g.moveTo(x-k*0.38,y+k*0.42);g.quadraticCurveTo(x-k*0.38,y-k*0.06,x,y-k*0.06);g.quadraticCurveTo(x+k*0.38,y-k*0.06,x+k*0.38,y+k*0.42);g.closePath();g.fill();
}
const S10B=words($('s10b'),'NECESITA A ~PERSONAS.~');
function s9(t){
  if(t<63.0||t>79)return;
  const sc=vamosScale(t);
  if(t<66.3){const a=P(t,63.1,63.9,E.outCubic)*(1-P(t,65.6,66.1,E.inOutSine));
    vamosText(bg,a,sc,lerp(18,0,P(t,63.1,64.0,E.outExpo)));}
  if(t<65.6)return;
  const fin=P(t,65.6,66.1,E.inOutSine);
  PEOPLE.forEach(q=>{
    const x0=W/2+(q.sx-W/2)*sc, y0=H/2+(q.sy-H/2)*sc;
    const p=E.outQuint(clamp((t-66.15-q.d)/1.4));
    const walk=Math.sin(t*9+q.ph)*Math.sin(Math.PI*p)*7;
    let x=lerp(x0,q.x,p), y=lerp(y0,q.y,p)-Math.abs(walk);
    if(p>=1)y+=Math.sin(t*2.2+q.ph)*1.5;
    // → isotipo
    const m=E.inOutCubic(clamp((t-72.4-q.dm)/1.25));
    x=lerp(x,q.m[0],m);y=lerp(y,q.m[1],m);
    const f=P(t,73.95,74.45,E.inOutSine);
    if(f<1)person(bg,x,y,24,mixRGB(q.c,C.brand,m),fin*(1-f),m);
  });
  const on=t>67.5&&t<72.6;vis($('s10'),on);
  if(on){reveal(S10B,t,67.75,0.1,0.95);S($('s10b'),out(t,72.05,0.45,30,12));}
}

function outro(t){
  if(t<73.8)return;
  const L=lockAt(LK1);
  drawLogo(bg,L.x,L.y,LK1,{markFill:P(t,73.95,74.45,E.inOutSine),
    letters:LETTERS.map((Lt,i)=>{const p=P(t,74.3+i*0.07,75.1+i*0.07,E.outExpo);return{op:p,dy:(1-p)*30}}),
    sheen:P(t,75.7,76.6,E.inOutSine)});
}

/* ───────── cuadro ───────── */
function renderFrame(t){
  fg.clearRect(0,0,W,H);
  const u=t-OFF;               // escenas posteriores a la bienvenida
  ambient(u,P(u,10.1,11.1,E.inOutSine)*(1-P(u,15.0,15.8,E.inOutSine))+P(u,29.0,30.2,E.inOutSine)*(1-P(u,34.8,35.6,E.inOutSine)));
  glass(u);
  s0(t);s1(u);s2(u);s3(u);s4txt(u);voices(u);s5(u);s6(u);s7(u);s8(u);s9(u);outro(u);
  intro(t);
}
window.renderFrame=renderFrame;

function measureDot(){
  const g=$('s1g'),v=$('s1');v.style.visibility='hidden';
  const rd=s=>{S(g,{s});S($('s1a'),{});const b=DOT.getBoundingClientRect();return{x:b.left+b.width/2,y:b.top+b.height/2,r:b.width/2}};
  DOT_END=rd(s1drift(9.4));DOT_REST=rd(1);
}
Promise.all([phLoad,document.fonts.load('700 100px Head'),document.fonts.load('400 100px Body'),document.fonts.load('700 100px Body')]).then(()=>{
  measureDot();buildPeople();
  const q=new URLSearchParams(location.search);
  if(q.has('play')){const t0=performance.now()-(+q.get('play')||0)*1000;const loop=()=>{renderFrame(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop)};loop();}
  else renderFrame(+(q.get('t')||0));
  window.READY=true;
});

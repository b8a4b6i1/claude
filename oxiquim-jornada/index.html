<!doctype html>
<html lang="es">

<style>
/* Títulos: Goli (oficial) — sustituto Figtree mientras no esté el archivo de Goli. Texto: Trebuchet MS (oficial). */
@font-face{font-family:'Head';src:local('Goli'),local('Goli Sans'),url(fonts/goli.woff2) format('woff2'),url(fonts/figtree-latin-wght-normal.woff2) format('woff2');font-weight:300 900;font-display:block}
@font-face{font-family:'Body';src:url(fonts/trebuc.ttf) format('truetype');font-weight:400;font-display:block}
@font-face{font-family:'Body';src:url(fonts/trebucbd.ttf) format('truetype');font-weight:700 900;font-display:block}
:root{--ink:#162851;--slate:#4b5571;--brand:#0055b8;--deep:#162851;--mid:#2a6fc4;--light:#7aa9e3;--pale:#dde6f3;--gray:#c6cad3;--vo:#225f58;--vc:#819e49;--mo:#410c5c;--am:#f9ab3a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#fff;font-family:'Head',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
canvas.layer{position:absolute;left:0;top:0;width:1080px;height:1920px}
.scene{position:absolute;inset:0;visibility:hidden}
.abs{position:absolute}
.blk{position:absolute;left:80px;width:920px;text-wrap:balance}
.ctr{text-align:center}
.w{display:inline-block;will-change:transform}
.mask{display:inline-block;overflow:hidden;padding:0.1em 0.05em 0.16em;margin:-0.1em -0.05em -0.16em;vertical-align:top}
.g{background:linear-gradient(95deg,#162851 0%,#0055b8 50%,#2a6fc4 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hl{background:linear-gradient(#c9dbf3,#c9dbf3) no-repeat 0 86%/0% 38%;border-radius:4px;color:var(--ink);font-weight:700}
#s2t,#s3t,#s6b,#s6c,#s7h{font-family:'Body',sans-serif}
.card{position:absolute;left:80px;width:920px;height:250px;border-radius:48px;background:#fff;border:1.5px solid #e3edfa;box-shadow:0 30px 70px -20px rgba(11,61,145,0.22),0 6px 18px rgba(11,61,145,0.06);display:flex;align-items:center;padding:0 40px;gap:44px}
.card .ic{width:170px;height:170px;border-radius:40px;background:linear-gradient(160deg,#f1f7ff,#e2eefd);flex:none;position:relative;overflow:hidden}
.card .ic canvas{position:absolute;inset:0;width:170px;height:170px}
.card .tx{font-size:60px;font-weight:800;letter-spacing:-0.035em;line-height:1.06}
.tag{display:inline-flex;align-items:center;gap:20px;padding:14px 38px 16px 30px;border-radius:999px;background:#e3ecf8;border:2px dashed #7aa9e3;color:#0055b8;font-size:64px;font-weight:800;letter-spacing:-0.02em}
.tag i{display:inline-block;width:22px;height:22px;border-radius:50%;background:#0055b8;box-shadow:0 0 0 0 rgba(0,85,184,0.45)}
.cal{position:absolute;width:400px;height:450px;border-radius:64px;background:#fff;overflow:hidden;box-shadow:0 30px 60px -18px rgba(0,20,60,0.55)}
.cal .hd{height:100px;background:linear-gradient(90deg,#162851,#0055b8);color:#fff;font-size:44px;font-weight:800;letter-spacing:0.16em;display:flex;align-items:center;justify-content:center;padding-left:0.16em}
.cal .wd{position:absolute;left:0;right:0;top:118px;text-align:center;font-size:40px;font-weight:800;letter-spacing:0.12em;padding-left:0.12em;color:#0055b8}
.cal .dg{position:absolute;left:0;right:0;top:160px;height:290px;overflow:hidden}
.cal .roll{position:absolute;left:0;right:0;top:0}
.cal .roll div{height:290px;line-height:270px;text-align:center;font-size:240px;font-weight:800;letter-spacing:-0.04em;color:var(--ink)}
</style>
</head>
<body>
<div id="stage">
  <canvas class="layer" id="bg" width="1080" height="1920"></canvas>

  <!-- 1 · Título -->
  <div class="scene" id="s1">
    <div class="abs ctr" id="s1lab" style="left:0;width:1080px;top:470px;font-size:84px;font-weight:800;color:var(--brand);letter-spacing:0.14em;padding-left:0.14em;white-space:nowrap"><span id="s1inv" style="display:inline-block;padding-bottom:18px;background:linear-gradient(#f9ab3a,#f9ab3a) no-repeat 50% 100%/0% 10px">INVITACIÓN</span></div>
    <div class="abs ctr" id="s1j" style="left:0;width:1080px;top:650px;font-size:46px;font-weight:800;color:var(--ink);letter-spacing:0.01em;white-space:nowrap">JORNADA GERENCIA DE PERSONAS</div>
  </div>

  <!-- 2 · Diagnóstico -->
  <div class="scene" id="s2">
    <div class="blk" id="s2t" style="top:1170px;font-size:74px;font-weight:600;letter-spacing:-0.03em;line-height:1.13;color:var(--slate)"></div>

  <!-- 3 · Plan de trabajo -->
  <div class="scene" id="s3">

  <div class="scene" id="s6">

    <div class="blk ctr" id="s6b" style="top:1110px;font-size:60px;font-weight:600;letter-spacing:-0.03em;line-height:1.16;color:var(--slate)"></div>
  </div>

  <!-- 7 · Equipo -->
  <div class="scene" id="s6t">

  <!-- 7 · Lo que queremos -->
  <div class="scene" id="s7">

    <div class="card" id="k1" style="top:640px"><div class="ic" style="background:linear-gradient(160deg,#f1f6fd,#e0eaf7)"><canvas id="ic1" width="170" height="170"></canvas></div><div class="tx">una mirada común,</div></div>
    <div class="card" id="k2" style="top:930px"><div class="ic" style="background:linear-gradient(160deg,#f1f6fd,#e0eaf7)"><canvas id="ic2" width="170" height="170"></canvas></div><div class="tx">prioridades claras</div></div>
    <div class="card" id="k3" style="top:1220px"><div class="ic" style="background:linear-gradient(160deg,#f1f6fd,#e0eaf7)"><canvas id="ic3" width="170" height="170"></canvas></div><div class="tx">y una hoja de ruta <span class="g">compartida.</span></div></div>
  </div>

  <!-- 11 · Nos vemos (última frase) -->
  <div class="scene" id="s8">
    <div class="abs ctr" id="s8a" style="left:0;width:1080px;top:850px;font-size:170px;font-weight:800;letter-spacing:-0.035em;line-height:1.08;white-space:nowrap"><div id="s8l1"></div></div>
  </div>

  <!-- 10 · Fecha (calendario) y lugar: Casa Conecta, con paisaje de Santiago -->
  <div class="scene" id="s9i">
    <div class="abs ctr" id="s9h" style="left:0;width:1080px;top:372px;font-size:70px;font-weight:800;letter-spacing:-0.035em;line-height:1.1;white-space:nowrap"></div>
    <div class="cal" id="s9cal" style="left:340px;top:452px">
      <div class="hd">OCTUBRE</div>

      <div class="dg"><div class="roll" id="s9roll"></div></div>
    </div>
    <div class="abs ctr" id="s9en" style="left:0;width:1080px;top:892px;font-size:60px;font-weight:700;letter-spacing:-0.02em;color:var(--slate)">en</div>
    <div class="abs" id="s9cc" style="left:0;width:1080px;top:978px;display:flex;align-items:center;justify-content:center;gap:28px;white-space:nowrap">
      <canvas id="ccLogo" width="132" height="132" style="width:132px;height:132px;flex:none"></canvas>
      <div id="s9ccn" style="font-size:92px;font-weight:800;letter-spacing:-0.04em;line-height:1"></div>
    </div>
  </div>

  <!-- 9 · R35 necesita a personas -->
  <div class="scene" id="s9">
    <div class="abs ctr" id="s9b" style="left:0;width:1080px;top:1210px;font-size:74px;font-weight:800;letter-spacing:-0.035em;line-height:1.1;white-space:nowrap"></div>
  </div>

  <canvas class="layer" id="fg" width="1080" height="1920"></canvas>
</div>

<script src="assets/logo-paths.js"></script>
<script>
'use strict';
const W=1080,H=1920,D5=0.8,D6=-13.8,D7=8.4,D9=2.5,DUR=71.0+D9+D5+D6+D7;
window.DUR=DUR;
/* ───────── utilidades ───────── */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const E={
  lin:t=>t,
  outCubic:t=>1-Math.pow(1-t,3),
  inCubic:t=>t*t*t,
  inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outQuint:t=>1-Math.pow(1-t,5),
  inQuint:t=>t*t*t*t*t,
  outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),
  inExpo:t=>t<=0?0:Math.pow(2,10*t-10),
  inOutExpo:t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2,
  inOutQuint:t=>t<.5?16*t*t*t*t*t:1-Math.pow(-2*t+2,5)/2,
  outBack:t=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  inOutSine:t=>-(Math.cos(Math.PI*t)-1)/2,
  // resorte amortiguado (sobrepaso amable)
  spring:t=>t>=1?1:1-Math.exp(-6.5*t)*Math.cos(9.5*t),
};
const P=(t,a,b,e=E.outExpo)=>e(clamp((t-a)/(b-a)));
const $=id=>document.getElementById(id);
function S(el,o={}){
  const {op=1,x=0,y=0,s=1,sx,sy,r=0,b=0}=o;
  el.style.opacity=op<0.001?0:op;
  el.style.transform=`translate(${x}px,${y}px) scale(${sx??s},${sy??s})${r?` rotate(${r}deg)`:''}`;
  el.style.filter=b>0.05?`blur(${b}px)`:'none';
}
function vis(el,on){el.style.visibility=on?'visible':'hidden'}
// entrada/salida de bloque: sube con desenfoque → nitidez; sale hacia arriba
function inOut(t,a,dIn,c,dOut,dist=50,blur=16){
  const i=P(t,a,a+dIn,E.outExpo), o=P(t,c,c+dOut,E.inCubic);
  return {op:i*(1-o), y:(1-i)*dist - o*dist, b:(1-i)*blur + o*blur};
}
// texto con marcado mínimo: *negrita*, _color de marca_, ~degradado~, [resaltado]
function words(el,src){
  el.innerHTML='';const out=[];
  src.split(' ').forEach((tok,i,arr)=>{
    if(tok==='/'){el.appendChild(document.createElement('br'));return;}
    let cls='',txt=tok,style='';
    const m=tok.match(/^([*_~\[])(.*?)([*_~\]])?$/);
    if(m){txt=m[2];cls={'*':'b','_':'br','~':'g','[':'hl'}[m[1]]}
    const mk=document.createElement('span');mk.className='mask';
    const s=document.createElement('span');s.className='w'+(cls==='g'?' g':cls==='hl'?' hl':'');s.textContent=txt;
    if(cls==='b'){s.style.fontWeight=800;s.style.color='var(--ink)'}
    if(cls==='br'){s.style.color='var(--brand)';s.style.fontWeight=700}
    mk.appendChild(s);el.appendChild(mk);
    if(i<arr.length-1&&arr[i+1]!=='/')el.appendChild(document.createTextNode(' '));
    out.push(s);
  });
  return out;
}
function chars(el,txt,cls=''){
  el.innerHTML='';
  return [...txt].map(ch=>{const s=document.createElement('span');s.className='w '+cls;s.textContent=ch===' '?' ':ch;el.appendChild(s);return s;});
}
// revelado palabra a palabra desde una máscara
function reveal(ws,t,a,stag=0.07,d=0.75,dist=1.15){
  ws.forEach((w,i)=>{const p=P(t,a+i*stag,a+i*stag+d,E.outExpo);
    const fs=parseFloat(getComputedStyle(w).fontSize);
    S(w,{y:(1-p)*fs*dist,op:Math.min(1,p*2.5)});});
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hexRGB=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixRGB=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];
const rgba=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
// lineamientos 2025: azul principal, azul oscuro, gris claro, verdes, morado, amarillo (+ tintes del azul)
const C={ink:hexRGB('#162851'),deep:hexRGB('#162851'),brand:hexRGB('#0055b8'),mid:hexRGB('#2a6fc4'),sky:hexRGB('#4d8bd6'),light:hexRGB('#7aa9e3'),soft:hexRGB('#b3cbea'),pale:hexRGB('#dde6f3'),gray:hexRGB('#c6cad3'),vo:hexRGB('#225f58'),vc:hexRGB('#819e49'),mo:hexRGB('#410c5c'),am:hexRGB('#f9ab3a'),mist:hexRGB('#eef2f8'),white:[255,255,255]};
const ramp=(k)=>k<.5?mixRGB(C.deep,C.brand,k*2):mixRGB(C.brand,C.light,(k-.5)*2);

// radios negativos por sobrepaso de easing → 0
for(const P2 of [CanvasRenderingContext2D.prototype,OffscreenCanvasRenderingContext2D.prototype]){
  const arc=P2.arc,ell=P2.ellipse;
  P2.arc=function(x,y,r,...a){return arc.call(this,x,y,Math.max(0,r),...a)};
  P2.ellipse=function(x,y,rx,ry,...a){return ell.call(this,x,y,Math.max(0,rx),Math.max(0,ry),...a)};
}
const bg=$('bg').getContext('2d'), fg=$('fg').getContext('2d');

/* ───────── logo (trazado del PNG original) ───────── */
const LG=window.LOGO;
const LP={};for(const k in LG.parts)LP[k]=new Path2D(LG.parts[k].d);
const LETTERS=['X','I','Q','U','I2','M'];
const LB={x0:LG.parts.mark.bbox[0],x1:LG.parts.M.bbox[2],y0:LG.parts.mark.bbox[1],y1:LG.parts.mark.bbox[3]};
const LK=860/(LB.x1-LB.x0);                                         // escala del logotipo completo
const LOCK={x:W/2-(LB.x0+LB.x1)/2*LK,y:H/2-(LB.y0+LB.y1)/2*LK}; // origen del logotipo centrado
const MB=LG.parts.mark.bbox, MC=[(MB[0]+MB[2])/2,(MB[1]+MB[3])/2]; // centro del isotipo (unidades logo)
// centro del hexágono interior: centroide de la pieza interior del isotipo
const INNER=(()=>{const c=new OffscreenCanvas(LG.w*4,LG.h*4),g=c.getContext('2d');g.scale(4,4);g.fill(LP.mark);
  const d=g.getImageData(0,0,c.width,c.height).data;
  // la pieza interior: píxeles llenos dentro de la franja central del isotipo, separados del anillo
  let sx=0,sy=0,n=0;const cy=Math.round(MC[1]*4);
  for(let y=cy-30;y<cy+30;y++)for(let x=Math.round(MC[0]*4-90);x<MC[0]*4+90;x++){if(d[(y*c.width+x)*4+3]>128){sx+=x;sy+=y;n++}}
  return [sx/n/4,sy/n/4];})();
const markLen=(()=>{const svg=document.createElementNS('http://www.w3.org/2000/svg','path');svg.setAttribute('d',LG.parts.mark.d);
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.appendChild(svg);document.body.appendChild(s);const L=svg.getTotalLength();s.remove();return L;})();
const logoBuf=new OffscreenCanvas(W,H), lb=logoBuf.getContext('2d');
// dibuja el logo: origen (ox,oy) en px, escala k; o: {mark:{fill,stroke,clipR}, letters:[{op,dy}], sheen}
function drawLogo(g,ox,oy,k,o){
  lb.setTransform(1,0,0,1,0,0);lb.clearRect(0,0,W,H);
  lb.setTransform(k,0,0,k,ox,oy);
  const col=LG.color;
  if(o.markFill>0){
    lb.save();
    if(o.clipR!=null){lb.beginPath();lb.arc(INNER[0],INNER[1],o.clipR,0,Math.PI*2);lb.clip();}
    lb.globalAlpha=o.markFill;lb.fillStyle=col;lb.fill(LP.mark);lb.restore();
  }
  if(o.stroke>0){
    lb.save();lb.lineWidth=2.2/k*1.6;lb.strokeStyle=col;lb.lineJoin='round';
    lb.setLineDash([markLen*o.stroke,markLen]);lb.globalAlpha=o.strokeOp??1;lb.stroke(LP.mark);lb.restore();
  }
  if(o.letters){
    LETTERS.forEach((L,i)=>{const s=o.letters[i];if(!s||s.op<=0)return;
      const bb=LG.parts[L].bbox;
      lb.save();lb.beginPath();lb.rect(bb[0]-4,bb[1]-2,bb[2]-bb[0]+8,bb[3]-bb[1]+6);lb.clip();
      lb.translate(0,s.dy);lb.globalAlpha=s.op;lb.fillStyle=col;lb.fill(LP[L]);lb.restore();});
  }
  if(o.sheen!=null&&o.sheen>0&&o.sheen<1){
    lb.save();lb.globalCompositeOperation='source-atop';
    const x=lerp(LB.x0-80,LB.x1+80,o.sheen);
    const gr=lb.createLinearGradient(x-40,0,x+40,0);
    gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(190,225,255,0.85)');gr.addColorStop(1,'rgba(255,255,255,0)');
    lb.setTransform(k,0,0,k,ox,oy);lb.transform(1,0,-0.5,1,0,0);
    lb.fillStyle=gr;lb.fillRect(LB.x0-200,LB.y0-20,LB.x1-LB.x0+400,LB.y1-LB.y0+40);lb.restore();
  }
  lb.setTransform(1,0,0,1,0,0);
  g.drawImage(logoBuf,0,0);
}

/* ───────── hexágono de marca (proporción del isotipo: lados a 45°) ───────── */
function hexPath(g,cx,cy,h,asp=1.86,rot=0){
  const w=h*asp,p=[[-w,0],[-w+h,-h],[w-h,-h],[w,0],[w-h,h],[-w+h,h]];
  const c=Math.cos(rot),s=Math.sin(rot);
  g.moveTo(cx+p[0][0]*c-p[0][1]*s,cy+p[0][0]*s+p[0][1]*c);
  for(let i=1;i<6;i++)g.lineTo(cx+p[i][0]*c-p[i][1]*s,cy+p[i][0]*s+p[i][1]*c);
  g.closePath();
}
function rrect(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* ───────── fondo ambiental ───────── */
function ambient(t,amt=1){
  bg.fillStyle='#fff';bg.fillRect(0,0,W,H);
  if(amt<=0)return;
  const blobs=[[200,380,700,C.light,0.10,0.13],[900,1500,760,C.mid,0.07,0.09],[760,700,520,C.soft,0.10,0.17]];
  blobs.forEach(([x,y,r,c,a,f],i)=>{
    const cx=x+Math.sin(t*f+i*2)*120, cy=y+Math.cos(t*f*1.3+i)*140;
    const gr=bg.createRadialGradient(cx,cy,0,cx,cy,r);
    gr.addColorStop(0,rgba(c,a*amt));gr.addColorStop(1,rgba(c,0));
    bg.fillStyle=gr;bg.fillRect(0,0,W,H);
  });
}

/* ───────── sistema de partículas (diagnóstico → resultados → plan) ───────── */
const NP=2200;
const R0=rng(7);
const PH=Float32Array.from({length:NP},()=>R0()*Math.PI*2);
const PJ=Float32Array.from({length:NP},()=>R0());
function sampleMask(draw,target){
  const c=new OffscreenCanvas(W,H),g=c.getContext('2d');draw(g);
  const d=g.getImageData(0,0,W,H).data;
  let best=null;
  for(let st=3;st<=14;st+=0.25){
    const pts=[];
    for(let y=st/2;y<H;y+=st)for(let x=st/2+((Math.round(y/st))%2)*st/2;x<W;x+=st){const i=((y|0)*W+(x|0))*4+3;if(d[i]>140)pts.push([x,y]);}
    if(pts.length<=target){best={pts,st};break;}
  }
  return best;
}
// formación = arrays x,y,a(alfa),r(radio),c(color),k(primaria)
function formation(primary,fillers){
  // primary: [[x,y,r,c]], fillers: [[x,y,r,c,a]] — total NP, ordenado por x para transiciones coherentes
  const all=primary.map(p=>({x:p[0],y:p[1],r:p[2],c:p[3],a:1,k:1}));
  for(let i=0;all.length<NP;i++){const f=fillers[i%fillers.length];all.push({x:f[0],y:f[1],r:f[2],c:f[3],a:f[4],k:0});}
  all.length=NP;
  all.sort((a,b)=>(a.x+a.y*0.15)-(b.x+b.y*0.15));
  return all;
}
const R1=rng(21);
// rejilla tenue de fondo (rellenos)

let F=[];               // formaciones

  const COLC=[C.brand,C.deep,C.sky,C.mid,C.brand,C.deep,C.sky,C.mid,C.brand];
  HTS.forEach((h,ci)=>{const cx=150+ci*97.5;const rows=Math.round(h*(base-top)/sp);

const PK=[[4.2,0.01,0],[4.9,1.5,0.7],[11.0,1.6,0.6],[17.1,1.4,0.6]];
function particles(t){
  if(t<4.2||t>23.2)return;
  let k=0;for(let i=0;i<PK.length;i++)if(t>=PK[i][0])k=i;
  const A=F[Math.max(0,k-1)],B=F[k],[t0,du,sp]=PK[k];
  // alfa global: el título sólido reemplaza a las partículas primarias; las barras sólidas también
  const titleSolid=P(t,6.3,7.0,E.inOutSine)*(1-P(t,10.75,11.05,E.inOutSine));
  const barSolid=P(t,18.5,19.1,E.inOutSine);
  const gridOut=1-P(t,22.4,23.1,E.inCubic);
  const fieldIn=P(t,4.25,5.0,E.outCubic);
  const scan=t>12.4&&t<14.6?lerp(1060,330,E.inOutSine(clamp((t-12.4)/2.2))):-999;
  for(let i=0;i<NP;i++){
    const a=A[i],b=B[i];
    const d=(b.x/W)*sp+PJ[i]*0.25;
    const p=k===0?1:E.inOutCubic(clamp((t-t0-d)/du));
    const da=(a.drift||0),db=(b.drift||0);
    const ax=a.x+Math.sin(t*0.55+PH[i])*da, ay=a.y+Math.cos(t*0.42+PH[i]*1.7)*da;
    const bx=b.x+Math.sin(t*0.55+PH[i])*db, by=b.y+Math.cos(t*0.42+PH[i]*1.7)*db;
    // arco suave durante el vuelo
    const arc=Math.sin(Math.PI*p)*(40+PJ[i]*60)*(i%2?1:-1);
    let x=lerp(ax,bx,p)+arc*0.3, y=lerp(ay,by,p)+arc;
    let r=lerp(a.r,b.r,p), al=lerp(a.a,b.a,p);
    const kk=p>0.5?b.k:a.k;
    if(k===1&&kk)al*=1-titleSolid;
    if(k===2&&p<0.5&&a.k)al*=1-titleSolid;
    if(k===3&&kk)al*=1-barSolid;
    if(!kk)al*=gridOut;
    if(k===0)al*=fieldIn;
    let col=mixRGB(a.c,b.c,p);
    if(scan>0&&k===2&&kk){const dd=Math.abs(y-scan);if(dd<70){const q=1-dd/70;r*=1+q*0.6;col=mixRGB(col,C.white,q*0.45)}}
    if(al<0.01)continue;
    bg.fillStyle=rgba(col,al);bg.beginPath();bg.arc(x,y,Math.max(0.5,r),0,Math.PI*2);bg.fill();
  }
  if(scan>0){const gr=bg.createLinearGradient(0,scan-80,0,scan+80);gr.addColorStop(0,'rgba(0,85,184,0)');gr.addColorStop(.5,'rgba(0,85,184,0.12)');gr.addColorStop(1,'rgba(0,85,184,0)');bg.fillStyle=gr;bg.fillRect(80,scan-80,920,160);}
}

function intro(t){
  if(t>5.6)return;
  const g=fg;
  const kM=490/(MB[2]-MB[0]);               // isotipo solo, grande
  const mv=P(t,1.75,2.65,E.inOutQuint);
  const k=lerp(kM,LK,mv);
  const ox0=W/2-MC[0]*kM, oy0=H/2-MC[1]*kM;
  let ox=lerp(ox0,LOCK.x,mv), oy=lerp(oy0,LOCK.y,mv);
  // zoom a través del hexágono interior
  const z=P(t,3.7,4.45,E.inExpo);
  const Z=1+z*140;
  const ix=ox+INNER[0]*k, iy=oy+INNER[1]*k;
  const tx=lerp(ix,W/2,P(t,3.75,4.3,E.inOutCubic)), ty=lerp(iy,H/2,P(t,3.75,4.3,E.inOutCubic));
  const iris=P(t,4.45,5.45,E.outExpo);
  if(t<4.45){
    g.fillStyle='#fff';g.fillRect(0,0,W,H);
    // punto inicial
    const dotIn=P(t,0.05,0.45,E.outBack), dotOut=P(t,0.5,0.8,E.inCubic);
    if(dotOut<1){
      const dx=ox0+INNER[0]*kM, dy=oy0+INNER[1]*kM;
      g.fillStyle=LG.color;g.globalAlpha=1-dotOut;g.beginPath();g.arc(dx,dy,14*dotIn,0,Math.PI*2);g.fill();
      const ring=P(t,0.15,0.9,E.outCubic);g.strokeStyle=LG.color;g.lineWidth=3;g.globalAlpha=(1-ring)*0.6;g.beginPath();g.arc(dx,dy,14+ring*160,0,Math.PI*2);g.stroke();g.globalAlpha=1;
    }
    const kz=k*Z, ozx=tx-INNER[0]*kz, ozy=ty-INNER[1]*kz;
    drawLogo(g,ozx,ozy,kz,{
      stroke:P(t,0.35,1.5,E.inOutCubic), strokeOp:1-P(t,1.35,1.7),
      markFill:P(t,1.05,1.25,E.lin), clipR:t<1.9?lerp(0,120,P(t,1.05,1.85,E.outCubic)):null,
      letters:LETTERS.map((L,i)=>{const p=P(t,2.1+i*0.07,2.85+i*0.07,E.outExpo);return{op:p,dy:(1-p)*36}}),
      sheen:P(t,2.95,3.7,E.inOutSine),
    });
    // destello radial en el relleno
    const fl=P(t,1.1,1.9,E.outCubic);
    if(fl>0&&fl<1){const cx=ox+INNER[0]*k,cy=oy+INNER[1]*k,gr=g.createRadialGradient(cx,cy,0,cx,cy,520*fl+40);
      gr.addColorStop(0,`rgba(90,176,255,${0.25*(1-fl)})`);gr.addColorStop(1,'rgba(90,176,255,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);}
  } else {
    // pantalla azul con iris hexagonal que revela la escena 1
    g.fillStyle=LG.color;g.beginPath();g.rect(0,0,W,H);
    hexPath(g,W/2,H/2,Math.max(0.1,iris*1150),1.5);
    g.fill('evenodd');
    // borde luminoso del iris
    if(iris<0.98){g.strokeStyle=`rgba(140,200,255,${0.8*(1-iris)})`;g.lineWidth=6;g.beginPath();hexPath(g,W/2,H/2,Math.max(0.1,iris*1150),1.5);g.stroke();}
  }
}

function sun(t){
  if(t<28.3||t>38.2)return;
  // sol que luego se convierte en el núcleo del objetivo (escena 6)
  const m=P(t,36.75,37.9,E.inOutQuint);
  const x=lerp(SUN.x,540,m), y=lerp(SUN.y,640,m)-Math.sin(Math.PI*m)*80;
  const r=lerp(SUN.r,46,m);
  const glow=1-m;
  if(glow>0){const gr=bg.createRadialGradient(x,y,r*0.6,x,y,r*3.2);gr.addColorStop(0,`rgba(249,171,58,${0.42*glow*glow})`);gr.addColorStop(1,'rgba(249,171,58,0)');bg.fillStyle=gr;bg.fillRect(0,0,W,H);}
  bg.save();
  bg.beginPath();
  if(m<0.01){bg.arc(x,y,r,0,Math.PI*2)}else{
    // círculo → hexágono de marca
    const N=96;for(let i=0;i<=N;i++){const a=i/N*Math.PI*2;const cx=Math.cos(a),cy=Math.sin(a);

const andes=x=>1475-120*Math.pow(1-Math.abs(Math.sin(x*0.0062+0.7)),1.5)-70*Math.pow(1-Math.abs(Math.sin(x*0.017+2.1)),1.6)-26*Math.pow(1-Math.abs(Math.sin(x*0.041+0.4)),1.4)-60*Math.exp(-(((x-760)/220)**2));
const cerro=x=>1600-250*Math.exp(-(((x-290)/200)**2))-55*Math.exp(-(((x-500)/120)**2))-20*Math.exp(-(((x-140)/90)**2));
function city(t){
  const out=P(t,64.5,65.1,E.inCubic);
  const lay=(d)=>{const up=P(t,60.2+d,61.3+d,E.outExpo);return up<=0?null:(1-up)*760+out*900;};
  // cordillera con nieve
  let dy=lay(0);
  if(dy!==null){
    bg.save();bg.translate(0,dy);
    bg.beginPath();bg.moveTo(-10,H+10);for(let x=-10;x<=W+10;x+=6)bg.lineTo(x,andes(x));bg.lineTo(W+10,H+10);bg.closePath();
    bg.fillStyle='#d3dff0';bg.fill();bg.save();bg.clip();
    bg.beginPath();for(let x=-10;x<=W+10;x+=6)bg.lineTo(x,andes(x));
    for(let x=W+10;x>=-10;x-=6){const h=1475-andes(x);bg.lineTo(x,andes(x)+Math.max(0,h-70)*0.42+4);}
    bg.closePath();bg.fillStyle='#f7faff';bg.fill();bg.restore();bg.restore();
  }
  // cerro San Cristóbal, con la virgen y una antena en la cumbre
  dy=lay(0.08);
  if(dy!==null){
    bg.save();bg.translate(0,dy);
    bg.beginPath();bg.moveTo(-10,H+10);for(let x=-10;x<=W+10;x+=6)bg.lineTo(x,cerro(x));bg.lineTo(W+10,H+10);bg.closePath();
    bg.fillStyle='#7fa2d4';bg.fill();
    const sx=290,sy=cerro(290)+2;
    bg.fillStyle='#4f7fc3';                              // la virgen, en silueta
    bg.fillRect(sx-14,sy-30,28,30);                       // pedestal
    bg.beginPath();bg.moveTo(sx-10,sy-30);bg.lineTo(sx-6,sy-86);bg.lineTo(sx+6,sy-86);bg.lineTo(sx+10,sy-30);bg.closePath();bg.fill();   // manto
    bg.beginPath();bg.moveTo(sx-6,sy-80);bg.lineTo(sx-22,sy-70);bg.lineTo(sx-20,sy-66);bg.lineTo(sx-5,sy-73);bg.moveTo(sx+6,sy-80);bg.lineTo(sx+22,sy-70);bg.lineTo(sx+20,sy-66);bg.lineTo(sx+5,sy-73);bg.fill();   // brazos abiertos
    bg.beginPath();bg.arc(sx,sy-94,8,0,Math.PI*2);bg.fill();   // cabeza
    bg.strokeStyle='#5f86c2';bg.lineWidth=3;bg.beginPath();bg.moveTo(sx+70,cerro(sx+70));bg.lineTo(sx+70,cerro(sx+70)-70);bg.stroke();   // antena
    bg.restore();
  }
  // edificios del plano medio
  dy=lay(0.14);
  if(dy!==null){bg.fillStyle='#a9c1e6';CITY.mid.forEach(q=>{const top=H-q.h+dy;bg.fillRect(q.x,top,q.w,q.h+10);if(q.cap)bg.fillRect(q.x+q.w*0.4,top-30,q.w*0.2,30);});}
  // torre Costanera: prisma que se afina y corona abierta
  dy=lay(0.18);
  if(dy!==null){
    const cx=795,top=1205+dy,bw=118,tw=78,base=H+10;
    const gr=bg.createLinearGradient(cx-bw/2,0,cx+bw/2,0);gr.addColorStop(0,'#2a6fc4');gr.addColorStop(0.55,'#4d8bd6');gr.addColorStop(1,'#1f5fb3');
    bg.fillStyle=gr;bg.beginPath();bg.moveTo(cx-bw/2,base);bg.lineTo(cx-tw/2,top);bg.lineTo(cx+tw/2,top);bg.lineTo(cx+bw/2,base);bg.closePath();bg.fill();
    bg.strokeStyle='rgba(220,234,252,0.35)';bg.lineWidth=2;
    for(let k=1;k<4;k++){const f=k/4;bg.beginPath();bg.moveTo(cx-bw/2+bw*f,base);bg.lineTo(cx-tw/2+tw*f,top);bg.stroke();}
    bg.strokeStyle='#2a6fc4';bg.lineWidth=4;   // corona: aristas que sobresalen
    [[-tw/2,-tw/2+6],[-tw/6,-tw/6],[tw/6,tw/6],[tw/2,tw/2-6]].forEach(([a,b])=>{bg.beginPath();bg.moveTo(cx+a,top);bg.lineTo(cx+b*0.8,top-46);bg.stroke();});
  }
  // plano cercano con ventanas que se encienden
  dy=lay(0.24);
  if(dy!==null){
    CITY.near.forEach(q=>{
      const top=H-q.h+dy;bg.fillStyle='#0055b8';bg.fillRect(q.x,top,q.w,q.h+10);
      if(q.cap){bg.fillRect(q.x+q.w*0.35,top-30,q.w*0.3,30);}
      for(let wy=top+24;wy<H-16;wy+=32)for(let wx=q.x+16;wx<q.x+q.w-22;wx+=26){
        const k=Math.sin(wx*12.9898+wy*78.233)*43758.5453;const rr=k-Math.floor(k);
        const on=P(t,60.9+rr*1.4,61.2+rr*1.4,E.outCubic)*(0.35+0.65*(0.5+0.5*Math.sin(t*1.5+rr*30)));
        if(rr<0.55&&on>0){bg.fillStyle=`rgba(220,234,252,${0.8*on})`;bg.fillRect(wx,wy,12,16);}
      }
    });
  }
}


/* ───────── escena 9 y 10: personas → 35 → marca ───────── */
const S9B=words($('s9b'),'NECESITA A ~PERSONAS.~');
let PEOPLE=[];
function buildPeople(){
  // «R35» formado por personas
  const s=(()=>{const c=new OffscreenCanvas(W,H),g=c.getContext('2d');g.fillStyle='#000';g.beginPath();
    g.font='800 520px Head';g.letterSpacing='-14px';g.textAlign='center';g.fillText('R35',W/2,1090);
    const d=g.getImageData(0,0,W,H).data,pts=[];const st=27;
    for(let y=640;y<1100;y+=st*0.9)for(let x=st/2+((Math.round(y/(st*0.9)))%2)*st/2;x<W;x+=st){const i=((y|0)*W+(x|0))*4+3;if(d[i]>160)pts.push([x,y])}return pts})();
  // destinos en el isotipo (escena 10)
  const mk=(()=>{const c=new OffscreenCanvas(W,H),g=c.getContext('2d');g.setTransform(LK,0,0,LK,LOCK.x,LOCK.y);g.fill(LP.mark);
    const d=g.getImageData(0,0,W,H).data,pts=[];for(let y=0;y<H;y+=6)for(let x=0;x<W;x+=6){if(d[(y*W+x)*4+3]>200)pts.push([x,y])}return pts})();
  const r=rng(35);
  for(let i=mk.length-1;i>0;i--){const j=(r()*(i+1))|0;[mk[i],mk[j]]=[mk[j],mk[i]]}
  CONF.forEach((q,i)=>q.m=mk[(i*37)%mk.length]);
  PEOPLE=s.map((p,i)=>{const side=r();let sx,sy;
    if(side<0.5){sx=r()*W;sy=H+60+r()*500}else if(side<0.75){sx=-60-r()*300;sy=600+r()*1300}else{sx=W+60+r()*300;sy=600+r()*1300}
    return{x:p[0],y:p[1],sx,sy,d:(1-(p[1]-700)/400)*0.5+r()*0.55,c:[C.deep,C.brand,C.brand,C.mid,C.sky,C.light][(r()*6)|0],ph:r()*6.28,m:mk[i%mk.length],dm:r()*0.35};});
}
function person(g,x,y,s,col,a,morph){
  g.fillStyle=rgba(col,a);
  if(morph>=1){g.beginPath();g.arc(x,y,3.4,0,Math.PI*2);g.fill();return}
  const k=lerp(s,7,morph);
  g.beginPath();g.arc(x,y-k*0.34,k*0.24,0,Math.PI*2);g.fill();
  g.beginPath();g.moveTo(x-k*0.38,y+k*0.42);g.quadraticCurveTo(x-k*0.38,y-k*0.06,x,y-k*0.06);g.quadraticCurveTo(x+k*0.38,y-k*0.06,x+k*0.38,y+k*0.42);g.closePath();g.fill();
}
function s9(t){
  const on=t>51.6&&t<58.2;vis($('s9'),on);
  if(t>51.6&&t<58.8){
    PEOPLE.forEach((q,i)=>{
      const p=E.outQuint(clamp((t-51.75-q.d)/1.25));
      const walk=Math.sin((t*9+q.ph))*(1-p)*10;
      let x=lerp(q.sx,q.x,p), y=lerp(q.sy,q.y,p)+walk-Math.abs(walk)*0.5;
      const idle=p>=1?Math.sin(t*2.2+q.ph)*1.6:0;y+=idle;
      // salida: cada persona vuelve por donde llegó
      const m=E.inQuint(clamp((t-57.6-q.dm)/0.8));
      x=lerp(x,q.sx,m);y=lerp(y,q.sy,m);
      person(bg,x,y,24,q.c,Math.min(1,p*3),0);
    });
  }
  if(!on)return;
  reveal(S9B,t,53.8,0.1,0.9);
  S($('s9b'),inOut(t,51,0.01,57.5,0.45,40,14));
}

function outro(t){
  if(t<66.6)return;
  const f=P(t,66.9,67.4,E.inOutSine);
  drawLogo(bg,LOCK.x,LOCK.y,LK,{markFill:f,stroke:0,
    letters:LETTERS.map((L,i)=>{const p=P(t,67.25+i*0.07,68.05+i*0.07,E.outExpo);return{op:p,dy:(1-p)*36}}),
    sheen:P(t,68.6,69.5,E.inOutSine)});
  // halo suave al asentarse la marca
  const h=P(t,67.0,68.2,E.outCubic);if(h<1&&h>0){const cx=LOCK.x+INNER[0]*LK,cy=LOCK.y+INNER[1]*LK;const gr=bg.createRadialGradient(cx,cy,0,cx,cy,600*h+60);gr.addColorStop(0,`rgba(0,85,184,${0.16*(1-h)})`);gr.addColorStop(1,'rgba(0,85,184,0)');bg.fillStyle=gr;bg.fillRect(0,0,W,H);}
}


/* ───────── cuadro ───────── */
function renderFrame(t){
  fg.clearRect(0,0,W,H);
  ambient(t,clamp((t-4.3)/0.8)*(1-P(t-D5-D6-D7-D9,65.8,67.0)));
  const u=t-D5, v=u-D6, w=v-D7, z=w-D9;   // relojes: objetivo/equipo (v), tarjetas/R35/fecha (w), «Nos vemos» y logo (z)
  particles(t);
  plan(t);
  target(v);
  team(v);
  s1(t);s2(t);s3(t);s6(v);s6t(v);s7(w);s9(w);s9i(w);s8(z);confetti(z);
  outro(z);
  intro(t);
}
window.renderFrame=renderFrame;

const ccLoad=new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=400;const g=c.getContext('2d');
  g.drawImage(im,0,0,400,400);g.globalCompositeOperation='source-in';g.fillStyle='#0055b8';g.fillRect(0,0,400,400);
  // recorte al contenido del símbolo (bbox del alfa) para centrarlo
  const k=document.createElement('canvas');k.width=k.height=400;const kg=k.getContext('2d');kg.drawImage(c,15,60,375,282,12,12+(375-282)/2,376,282);CC_IMG=k;res();};im.onerror=()=>res();im.src='assets/casa-conecta-logo.png';});
Promise.all([ccLoad,document.fonts.load('800 100px Head'),document.fonts.load('700 100px Head'),document.fonts.load('400 100px Body'),document.fonts.load('700 100px Body')]).then(()=>{
  buildFormations();buildPeople();
  const q=new URLSearchParams(location.search);
  if(q.has('play')){const t0=performance.now()-(+q.get('play')||0)*1000;const loop=()=>{renderFrame(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop)};loop();}
  else renderFrame(+(q.get('t')||0));
  window.READY=true;
});
</script>
